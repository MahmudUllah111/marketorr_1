<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <radialGradient id="netBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0b2447" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#040d1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#02060d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1be2eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#netBg)"/>

  <!-- Network Map / Connectivity Nodes in Background -->
  <g stroke="rgba(56,189,248,0.2)" stroke-width="1.5">
    <line x1="150" y1="200" x2="320" y2="150"/>
    <line x1="320" y1="150" x2="480" y2="240"/>
    <line x1="480" y1="240" x2="720" y2="180"/>
    <line x1="720" y1="180" x2="900" y2="260"/>
    <line x1="900" y1="260" x2="1050" y2="160"/>
    <line x1="320" y1="150" x2="400" y2="350"/>
    <line x1="720" y1="180" x2="800" y2="360"/>
  </g>
  <!-- Node pulses -->
  <circle cx="320" cy="150" r="5" fill="#1be2eb"/>
  <circle cx="480" cy="240" r="4" fill="#38bdf8"/>
  <circle cx="720" cy="180" r="6" fill="#1be2eb"/>
  <circle cx="900" cy="260" r="5" fill="#38bdf8"/>

  <!-- Responsive Dashboard & Portal Preview -->
  <g transform="translate(250, 140)">
    <rect width="700" height="380" rx="14" fill="#081426" stroke="rgba(27,226,235,0.3)" stroke-width="1.5"/>

    <!-- App Bar -->
    <rect width="700" height="42" rx="14" fill="#0e223d"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>
    <text x="350" y="26" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="2">CITY_ONLINE // CUSTOMER_BROADBAND_PORTAL</text>

    <!-- Plan Card Column 1: Ultra Fiber -->
    <g transform="translate(40, 70)">
      <rect width="180" height="260" rx="10" fill="#0b1b30" stroke="rgba(27,226,235,0.2)"/>
      <text x="90" y="35" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#94a3b8">STARTER FIBER</text>
      <text x="90" y="75" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="28" fill="#ffffff">30 <tspan font-size="14" font-weight="500">Mbps</tspan></text>
      <line x1="20" y1="100" x2="160" y2="100" stroke="rgba(255,255,255,0.1)"/>
      <text x="90" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Unlimited Data</text>
      <text x="90" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">24/7 Priority NOC</text>
      <rect x="25" y="205" width="130" height="32" rx="16" fill="#132a4a" stroke="#38bdf8"/>
      <text x="90" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">SUBSCRIBE</text>
    </g>

    <!-- Plan Card Column 2: Turbo Gig (Featured) -->
    <g transform="translate(260, 60)">
      <rect width="180" height="280" rx="10" fill="#0f2645" stroke="#1be2eb" stroke-width="2"/>
      <rect x="35" y="-12" width="110" height="24" rx="12" fill="#1be2eb"/>
      <text x="90" y="4" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="9" letter-spacing="1" fill="#040d1a">MOST POPULAR</text>
      <text x="90" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#38bdf8">TURBO ENTERPRISE</text>
      <text x="90" y="85" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="28" fill="#ffffff">100 <tspan font-size="14" font-weight="500">Mbps</tspan></text>
      <line x1="20" y1="110" x2="160" y2="110" stroke="rgba(255,255,255,0.1)"/>
      <text x="90" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Dedicated Optical Core</text>
      <text x="90" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Redundant Routing</text>
      <rect x="25" y="215" width="130" height="36" rx="18" fill="#1be2eb"/>
      <text x="90" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#040d1a">CONNECT NOW</text>
    </g>

    <!-- Plan Card Column 3: Corporate Leased Line -->
    <g transform="translate(480, 70)">
      <rect width="180" height="260" rx="10" fill="#0b1b30" stroke="rgba(27,226,235,0.2)"/>
      <text x="90" y="35" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#94a3b8">DEDICATED LEASE</text>
      <text x="90" y="75" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="24" fill="#ffffff">CUSTOM</text>
      <line x1="20" y1="100" x2="160" y2="100" stroke="rgba(255,255,255,0.1)"/>
      <text x="90" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">1:1 Symmetric Ratio</text>
      <text x="90" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">99.9% SLA Guarantee</text>
      <rect x="25" y="205" width="130" height="32" rx="16" fill="#132a4a" stroke="#38bdf8"/>
      <text x="90" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">INQUIRE B2B</text>
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="600" y="610" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="8" fill="#ffffff">
    CITY ONLINE LIMITED
  </text>
  <text x="600" y="642" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="4" fill="#1be2eb">
    ISP BRAND IDENTITY, PORTAL UI/UX &amp; WEB DEVELOPMENT
  </text>
</svg>
