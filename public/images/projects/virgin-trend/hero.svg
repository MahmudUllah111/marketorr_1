      <stop offset="0%" stop-color="#2a0845" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#12041d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06010a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="vtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#891ffb"/>
